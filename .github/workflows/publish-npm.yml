name: Publish to npm

# The npm half of a release, callable on its own.
#
# It used to live inline in release.yml as a job with `needs: release`,
# which meant anything that failed the release job — including the
# cosmetic docs-site dispatch at its very end — silently skipped the npm
# publish. That is how npm sat on 2.12.2 while GitHub Releases served
# 2.13.0 and 2.13.1, with no way to publish the missing versions short
# of re-running goreleaser against an already-published tag.
#
# Splitting it out gives a recovery path: dispatch this with a tag and
# it republishes from the GitHub release artifacts, verifying SHA256SUMS
# first. Publishing is idempotent-ish — npm refuses to overwrite an
# existing version, so a re-run for an already-published version fails
# loudly rather than corrupting anything.
#
# It must stay in CI rather than being run from a laptop: `npm publish
# --provenance` needs the OIDC token this environment provides, and the
# npm credential belongs in a repository secret, not on a workstation.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v2.13.1). The GitHub release must already exist with its tarballs + SHA256SUMS."
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag. Keep 'latest' for a normal release. Use 'previous' when back-filling a version OLDER than what is already published — npm does no semver check and would otherwise point 'latest' at the older version, downgrading every install."
        required: false
        default: latest
        type: string
      checkout_ref:
        description: "Tree to run from. Empty = the tag itself, which is what you want. Set to 'main' only when back-filling a tag whose tooling predates a feature you need — first confirm `git diff <tag> main -- npm/` is empty, or you would publish package sources the tag never had."
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      dist_tag:
        required: false
        default: latest
        type: string

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for `npm publish --provenance`
    env:
      TAG: ${{ inputs.tag }}
      DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
      CHECKOUT_REF: ${{ inputs.checkout_ref || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || inputs.tag }}

      # The tree is normally the tag's, so the tooling is as old as the
      # tag. publish-npm.mjs only learned --dist-tag in v2.13.2; older
      # copies parse args by scanning for the flags they know and ignore
      # the rest, so a back-fill dispatched against such a tag would
      # accept the flag, drop it, publish to `latest`, and downgrade
      # every install — silently, which is the whole failure mode this
      # is meant to prevent. Turn it into a loud stop with the remedy.
      - name: Verify the tooling honours the requested dist-tag
        run: |
          if [ "$DIST_TAG" != "latest" ] && ! grep -q -- "--dist-tag" scripts/publish-npm.mjs; then
            echo "::error::scripts/publish-npm.mjs at $CHECKOUT_REF predates --dist-tag support: it would ignore dist_tag=$DIST_TAG and publish to 'latest', downgrading installs. Re-dispatch with checkout_ref=main after confirming 'git diff $TAG main -- npm/' is empty."
            exit 1
          fi
          echo "tooling at $CHECKOUT_REF honours dist_tag=$DIST_TAG"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-npm.mjs --tag "$TAG" --dist-tag "$DIST_TAG"
