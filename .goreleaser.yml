# goreleaser config for opendray v2.
#
# Builds a single binary that already contains the React SPA via
# go:embed. Pre-build hooks `pnpm install` + `pnpm build` so the embed
# tree is populated before `go build` runs.
#
# `goreleaser release` is intended to run from CI on tag push; the
# Release workflow that triggers it lives separately.
version: 2

project_name: opendray

before:
  hooks:
    # `verify` reads go.sum without modifying any tracked files — safe
    # to run on a release tag. `tidy` would rewrite go.mod/go.sum and
    # surprise the build at the worst possible moment.
    - go mod verify
    # Build the web bundle so internal/web/dist/ is populated before
    # the Go build embeds it. CI runs from a clean checkout so the
    # dist tree is always rebuilt; this matches the README quickstart.
    - sh -c 'cd app/web && pnpm install --frozen-lockfile'
    - sh -c 'cd app/web && pnpm build'

builds:
  - id: opendray
    main: ./cmd/opendray
    binary: opendray
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/opendray/opendray-v2/internal/version.Version={{.Version}}
      - -X github.com/opendray/opendray-v2/internal/version.Commit={{.ShortCommit}}
      - -X github.com/opendray/opendray-v2/internal/version.Date={{.Date}}
    hooks:
      # Per-binary post hook: Developer ID sign + notarize the macOS
      # artifacts via quill (runs on the Linux runner). The script is a
      # no-op for non-darwin targets and when no signing creds are
      # configured (QUILL_SIGN_P12 empty) — so Linux/Windows builds and
      # unsigned snapshot/PR builds are unaffected. Reads QUILL_* /
      # MACOS_NOTARY_KEY_P8 from the inherited (workflow) environment.
      post:
        - cmd: ./scripts/macos-sign.sh "{{ .Path }}" "{{ .Os }}"
          output: true

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - config.example.toml

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-snapshot-{{ .ShortCommit }}"

changelog:
  # CHANGELOG.md is hand-curated per Keep-a-Changelog, and release.yml
  # extracts the section matching the tag and passes it as
  # --release-notes. That flag fills goreleaser's changelog slot, so
  # this section must NOT be disabled: `disable: true` skips the slot
  # entirely and the body collapses to `release.header` alone. That is
  # exactly what happened to every release from v2.12.0 to v2.13.1 —
  # the notes were extracted correctly on every run and then dropped
  # on the floor.
  #
  # Filtering only affects the auto-generated commit list, which
  # --release-notes replaces; it is kept as the shape of the fallback
  # when someone runs goreleaser by hand without the flag.
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # Publish directly (not as draft). The publish-npm job in
  # release.yml fetches SHA256SUMS via the public release
  # download URL — that path only exists once the release is
  # published, so a draft release breaks the npm publish chain.
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  # No header: the body IS the CHANGELOG section for this tag, passed
  # via --release-notes. A "see CHANGELOG.md for the full notes" line
  # above the full notes is just noise — the link belongs at the end,
  # where it points at the history rather than at the page you are on.
  footer: |

    ---
    Full history: [CHANGELOG.md](https://github.com/Opendray/opendray/blob/main/CHANGELOG.md)
